<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório do Toque</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="cards.css">
<link rel="stylesheet" href="office.css">
<link rel="stylesheet" href="feed.css">
<link rel="stylesheet" href="timeline.css">
<link rel="stylesheet" href="notify.css">
</head>
<body>
<header>
  <h1>Toque</h1>
  <span class="sub" id="summary">A carregar…</span>
  <button class="tv-toggle" id="tv-toggle" title="Só o escritório, em ecrã inteiro (Esc para sair)">📺 Modo TV</button>
  <span id="notify-slot"></span>
  <span class="live" id="live"><span class="dot"></span><span id="live-text">ao vivo</span></span>
</header>

<div class="layout">
  <main>
    <div id="needs-you"></div>
    <div id="office-wrap">
      <div id="stage" class="instant"></div>
      <div class="office-hint">Clica numa pessoa para ver o que está a fazer</div>
    </div>
    <div class="view-tabs" id="view-tabs">
      <button data-view="agents">Agentes</button>
      <button data-view="items">Work items <span class="count" id="items-count"></span></button>
      <span class="sub" id="filter-hint"></span>
    </div>
    <div class="agents" id="agents"></div>
    <div id="work-items" hidden></div>
  </main>
  <aside>
    <div id="detail"></div>
    <div id="timeline"></div>
    <h2>Atividade</h2>
    <div class="filters" id="kind-filters"></div>
    <div id="feed"></div>
  </aside>
</div>

<script src="core.js"></script>
<script src="office.js"></script>
<script src="agents.js"></script>
<script src="feed.js"></script>
<script src="timeline.js"></script>
<script src="notify.js"></script>
<script src="app.js"></script>
</body>
</html>
